- id: '1752144414825'
  alias: Doorbell announce Google Home
  description: 'Doorbell pressed: every speaker to 100%, say ''Someone is at the front
    door'' on each speaker individually (Cast groups cut short clips off), then restore
    each speaker''s previous volume (50% if it was off and had none). Audio is cached
    so repeat rings work offline.'
  triggers:
  - trigger: state
    entity_id: binary_sensor.front_door_bell_ring
    from: 'off'
    to: 'on'
  conditions: []
  actions:
  - variables:
      speakers:
      - media_player.kitchen_mini
      - media_player.kitchen_hub
      - media_player.living_room_mini
      - media_player.dining_room_mini
      - media_player.front_study_speaker
      - media_player.study_mini
      - media_player.master_bedroom_display
      - media_player.bedroom_hub
      - media_player.guest_bedroom_speaker
      - media_player.upstairs_hallway_mini
      previous: '{% set ns = namespace(items=[]) %}{% for e in speakers %}{% set v
        = state_attr(e, ''volume_level'') %}{% set ns.items = ns.items + [[e, v if
        v is number else 0.5]] %}{% endfor %}{{ ns.items }}'
  - action: media_player.volume_set
    target:
      entity_id: '{{ speakers }}'
    data:
      volume_level: 1.0
    continue_on_error: true
  - action: tts.speak
    target:
      entity_id: tts.google_translate_en_com
    data:
      media_player_entity_id: '{{ speakers }}'
      message: Someone is at the front door
      cache: true
  - delay: 00:00:07
  - repeat:
      for_each: '{{ previous }}'
      sequence:
      - action: media_player.volume_set
        target:
          entity_id: '{{ repeat.item[0] }}'
        data:
          volume_level: '{{ repeat.item[1] }}'
        continue_on_error: true
  mode: single
- id: notify_iphone_of_updates
  alias: Notify iPhone of updates
  description: One push listing all pending updates with Install all / Later. Fires
    5 min after a new update appears (bursts collapse into one) and as a weekly reminder
    on Sundays at 10:00. Update entities are listed explicitly; rerun ha_update_notify.py
    after adding integrations.
  triggers:
  - trigger: state
    entity_id:
    - update.advanced_ssh_web_terminal_update
    - update.button_card_update
    - update.custom_brand_icons_update
    - update.dahua_update
    - update.foxess_cloud_update
    - update.hacs_update
    - update.home_assistant_connect_zbt_2_dcb4d90e8d1c_firmware
    - update.home_assistant_core_update
    - update.home_assistant_operating_system_update
    - update.home_assistant_supervisor_update
    - update.material_symbols_update
    - update.matter_server_update
    - update.mosquitto_broker_update
    - update.mushroom_update
    - update.zigbee2mqtt_update
    from: 'off'
    to: 'on'
    id: new
  - trigger: time
    at: '10:00:00'
    id: weekly
  conditions:
  - condition: template
    value_template: '{{ trigger.id == ''new'' or now().weekday() == 6 }}'
  actions:
  - if:
    - condition: trigger
      id: new
    then:
    - delay: 00:05:00
  - condition: template
    value_template: '{{ states.update | rejectattr(''entity_id'', ''match'', ''update.wud_'')
      | selectattr(''state'', ''eq'', ''on'') | list | count > 0 }}'
  - condition: state
    entity_id: script.install_pending_updates
    state: 'off'
  - variables:
      act_install: '{{ ''UPDATES_INSTALL_'' ~ context.id }}'
      act_later: '{{ ''UPDATES_LATER_'' ~ context.id }}'
  - action: notify.mobile_app_jareds_iphone
    data:
      title: '{{ states.update | rejectattr(''entity_id'', ''match'', ''update.wud_'')
        | selectattr(''state'', ''eq'', ''on'') | list | count }} Home Assistant updates'
      message: '{% for s in states.update | rejectattr(''entity_id'', ''match'', ''update.wud_'')
        | selectattr(''state'', ''eq'', ''on'') %}{{ s.attributes.title or s.name
        }}: {{ s.attributes.installed_version }} -> {{ s.attributes.latest_version
        }}

        {% endfor %}Order: apps first, then Core (restart), then OS (reboot).'
      data:
        tag: ha_updates
        actions:
        - action: '{{ act_install }}'
          title: Install all
          authenticationRequired: true
        - action: '{{ act_later }}'
          title: Later
  - wait_for_trigger:
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: '{{ act_install }}'
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: '{{ act_later }}'
    timeout: '24:00:00'
    continue_on_timeout: false
  - condition: template
    value_template: '{{ wait.trigger.event.data.action == act_install }}'
  - action: script.turn_on
    target:
      entity_id: script.install_pending_updates
  mode: restart
- id: resume_updates_after_restart
  alias: Resume updates after restart
  description: After a Core/OS update restarts HA, continue script.install_pending_updates.
  triggers:
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: input_boolean.updates_resume_after_restart
    state: 'on'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.updates_resume_after_restart
  - delay: 00:02:00
  - action: script.turn_on
    target:
      entity_id: script.install_pending_updates
  mode: single
- id: notify_iphone_of_container_updates
  alias: Notify iPhone of container updates
  description: One push listing Unraid container updates found by What's Up Docker
    (report-only). Waits 10 min so bursts collapse into one push. Tapping it opens
    the WUD page. Updates are approved by hand (Compose Manager > Update Stack); HA's
    Install buttons do nothing.
  triggers:
  - trigger: state
    entity_id: sensor.wud_container_update_count
  conditions:
  - condition: template
    value_template: '{{ trigger.from_state is not none and trigger.from_state.state
      not in [''unknown'', ''unavailable''] and trigger.to_state.state | int(0) >
      trigger.from_state.state | int(0) }}'
  actions:
  - delay: 00:10:00
  - condition: template
    value_template: '{{ states.update | selectattr(''entity_id'', ''match'', ''update.wud_'')
      | selectattr(''state'', ''eq'', ''on'') | list | count > 0 }}'
  - action: notify.mobile_app_jareds_iphone
    data:
      title: '{% set n = states.update | selectattr(''entity_id'', ''match'', ''update.wud_'')
        | selectattr(''state'', ''eq'', ''on'') | list | count %}{{ n }} container
        update{{ ''s'' if n > 1 }}'
      message: '{% for s in states.update | selectattr(''entity_id'', ''match'', ''update.wud_'')
        | selectattr(''state'', ''eq'', ''on'') %}{% set a = s.attributes %}{{ s.name
        }}: {{ ''new build of '' ~ a.installed_version if (a.latest_version or '''')
        is match(''sha256'') else a.installed_version ~ '' -> '' ~ a.latest_version
        }}

        {% endfor %}'
      data:
        tag: container_updates
        url: https://wud.int.jyoung-primary.com
  mode: restart
- id: front_door_hallway_lights_at_night
  alias: 'Front door opened at night: hallway lights'
  description: When the front door opens after sunset (sun below the horizon; follows
    Sydney sunset and daylight saving automatically), turn the downstairs hallway
    lights on. After 2 minutes they turn off, but only once the hallway motion sensor
    has seen no motion for 1 minute (if motion keeps being reported, off 15 minutes
    after the door opened anyway). Opening the door again restarts it. Does nothing
    in the day, nothing on close, and leaves the lights alone if they were already
    on.
  triggers:
  - trigger: state
    entity_id: binary_sensor.front_door_sensor_contact
    from: 'off'
    to: 'on'
  conditions:
  - condition: state
    entity_id: sun.sun
    state: below_horizon
  - condition: template
    value_template: '{{ is_state(''light.downstairs_hallway_lights'', ''off'') or
      (this.attributes.current | int(0)) > 0 }}'
  actions:
  - action: light.turn_on
    target:
      entity_id: light.downstairs_hallway_lights
  - delay: 00:02:00
  - repeat:
      until:
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.downstairs_hallway_motion_sensor_motion
          state: 'off'
          for: 00:01:00
        - condition: template
          value_template: '{{ repeat.index >= 52 }}'
      sequence:
      - delay: 00:00:15
  - action: light.turn_off
    target:
      entity_id: light.downstairs_hallway_lights
  mode: restart
- id: back_door_dining_lights_at_night
  alias: 'Back door opened at night: dining room lights'
  description: When the back door opens after sunset (sun below the horizon; follows
    Sydney sunset and daylight saving automatically), turn the dining room lights
    on for 2 minutes, then off. Opening the door again restarts the timer. Does nothing
    in the day, nothing on close, and leaves the lights alone if they were already
    on.
  triggers:
  - trigger: state
    entity_id: binary_sensor.back_door_sensor_contact
    from: 'off'
    to: 'on'
  conditions:
  - condition: state
    entity_id: sun.sun
    state: below_horizon
  - condition: template
    value_template: '{{ is_state(''light.dining_room_lights'', ''off'') or (this.attributes.current
      | int(0)) > 0 }}'
  actions:
  - action: light.turn_on
    target:
      entity_id: light.dining_room_lights
  - delay: 00:02:00
  - action: light.turn_off
    target:
      entity_id: light.dining_room_lights
  mode: restart
- id: seed_light_schedule
  alias: 'Seed light: on 08:00 to midnight'
  description: Seed Light plug (Meross, local) is on from 08:00 until midnight and
    off overnight. Also re-applies the right state when HA starts or the plug comes
    back after a power cut, so a missed 08:00 or 00:00 never leaves it wrong.
  triggers:
  - trigger: time
    at: 08:00:00
  - trigger: time
    at: 00:00:00
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id: switch.seed_light
    from: unavailable
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ now().hour >= 8 }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.seed_light
    default:
    - action: switch.turn_off
      target:
        entity_id: switch.seed_light
  mode: restart
