global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:

rule_files:

scrape_configs:
  - job_name: "node_exporter"
    static_configs:
      - targets:
          - "10.0.51.102:9100"
          - "10.0.51.254:9100"
          - "10.0.3.11:9100"
        labels:
          app: "node_exporter"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
