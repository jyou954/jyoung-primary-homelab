name: immich

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: immich-server
    restart: always
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
      - immich_internal
    depends_on:
      - immich-redis
      - immich-postgresql
    env_file:
      - .env
      - /mnt/user/system/secrets/immich.env
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      disable: false
    ports: # Purely for App access via Tailscale Unraid IP with Port
      - "2283:2283"  
    labels:
      - "wud.display.name=Immich"
      - "traefik.enable=true"
      - "traefik.http.routers.immich.rule=Host(`immich.int.jyoung-primary.com`)"
      - "traefik.http.routers.immich.entrypoints=websecure"
      - "traefik.http.routers.immich.tls=true"
      - "traefik.http.routers.immich.tls.certresolver=stepca"
      - "traefik.http.services.immich.loadbalancer.server.port=2283"

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    container_name: immich-machine-learning
    labels:
      - "wud.display.name=Immich Machine Learning"
    restart: always
    networks:
      - immich_internal
    env_file:
      - .env
      - /mnt/user/system/secrets/immich.env
    volumes:
      - model-cache:/cache
    healthcheck:
      disable: false

  immich-redis:
    image: docker.io/valkey/valkey:9@sha256:3b55fbaa0cd93cf0d9d961f405e4dfcc70efe325e2d84da207a0a8e6d8fde4f9
    container_name: immich-redis
    labels:
      - "wud.display.name=Immich Redis"
    restart: unless-stopped
    networks:
      - immich_internal
    healthcheck:
      test: redis-cli ping || exit 1

  immich-postgresql:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich-postgresql
    labels:
      - "wud.display.name=Immich Database"
    restart: always
    networks:
      - immich_internal
    env_file:
      - /mnt/user/system/secrets/immich.env
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      disable: false

volumes:
  model-cache:

networks:
  frontend:
    external: true
  immich_internal:
    internal: true
