name: homepage

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    networks:
      - frontend
    env_file:
      - /mnt/user/system/secrets/homepage.env
    environment:
      HOMEPAGE_ALLOWED_HOSTS: homepage.int.jyoung-primary.com
    volumes:
      - /mnt/user/appdata/homepage:/app/config
      - /mnt/user/appdata/homepage/icons:/app/public/icons
      # Empty folder on the array, read-only: lets the resources widget show array free space.
      - /mnt/user/system/homepage-array:/mnt/array:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`homepage.int.jyoung-primary.com`)"
      - "traefik.http.routers.homepage.entrypoints=websecure"
      - "traefik.http.routers.homepage.tls=true"
      - "traefik.http.routers.homepage.tls.certresolver=stepca"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"
      - "wud.display.name=Homepage"
      - "wud.trigger.include=docker.autoupdate,mqtt.ha"

networks:
  frontend:
    external: true
